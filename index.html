<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LumaGarden — проверка домена</title>
<meta name="description" content="Тестовая страница LumaGarden: проверка, что домен подключён и сайт отдаётся корректно.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<style>
  :root{
    --bg:#0e1a14; --bg2:#122a1f; --card:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.12); --text:#eaf5ee; --muted:#9fbcab;
    --accent:#5fe3a1; --accent2:#a8f0c6;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(95,227,161,.22), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(72,163,255,.14), transparent 55%),
      linear-gradient(160deg,var(--bg),var(--bg2));
    background-attachment:fixed;
    display:flex; align-items:center; justify-content:center; padding:32px 20px;
  }
  .wrap{width:100%; max-width:640px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:36px 32px; backdrop-filter:blur(10px);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  }
  .logo{font-size:44px; line-height:1; margin-bottom:14px}
  h1{margin:0 0 6px; font-size:32px; letter-spacing:-.02em}
  .sub{margin:0 0 26px; color:var(--muted)}
  .status{
    display:inline-flex; align-items:center; gap:10px; padding:8px 14px; border-radius:999px;
    background:rgba(95,227,161,.12); border:1px solid rgba(95,227,161,.35);
    color:var(--accent2); font-weight:600; font-size:14px; margin-bottom:26px;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(95,227,161,.7);animation:pulse 2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 12px rgba(95,227,161,0)}100%{box-shadow:0 0 0 0 rgba(95,227,161,0)}}
  dl{margin:0; border-top:1px solid var(--line)}
  .row{display:flex; justify-content:space-between; gap:16px; padding:11px 0; border-bottom:1px solid var(--line)}
  dt{color:var(--muted); font-size:14px; margin:0}
  dd{margin:0; font-size:14px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; text-align:right; word-break:break-all}
  footer{margin-top:24px; color:var(--muted); font-size:13px}
  a{color:var(--accent2)}
  @media (max-width:480px){
    .card{padding:26px 20px} h1{font-size:26px}
    .row{flex-direction:column; gap:2px} dd{text-align:left}
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <div class="logo">🌿</div>
      <h1>LumaGarden</h1>
      <p class="sub">Тестовая страница. Если вы это видите — домен подключён и сайт отдаётся.</p>

      <div class="status"><span class="dot"></span><span>Сайт работает</span></div>

      <dl>
        <div class="row"><dt>Домен</dt><dd id="host">—</dd></div>
        <div class="row"><dt>Протокол</dt><dd id="proto">—</dd></div>
        <div class="row"><dt>Полный URL</dt><dd id="url">—</dd></div>
        <div class="row"><dt>Время загрузки</dt><dd id="load">—</dd></div>
        <div class="row"><dt>Локальное время</dt><dd id="now">—</dd></div>
        <div class="row"><dt>Версия сборки</dt><dd id="build">—</dd></div>
      </dl>

      <footer>Статическая страница на GitHub Pages · <a href="https://github.com/asilJPG/lumagarden">репозиторий</a></footer>
    </div>
  </main>

<script>
  var BUILD = "2026-08-22";
  var t0 = performance.now();
  document.getElementById('host').textContent  = location.hostname || '(локальный файл)';
  document.getElementById('proto').textContent = location.protocol.replace(':','');
  document.getElementById('url').textContent   = location.href;
  document.getElementById('build').textContent = BUILD;
  function tick(){ document.getElementById('now').textContent = new Date().toLocaleString(); }
  tick(); setInterval(tick, 1000);
  window.addEventListener('load', function(){
    document.getElementById('load').textContent = Math.round(performance.now() - t0) + ' мс';
  });
</script>
</body>
</html>
